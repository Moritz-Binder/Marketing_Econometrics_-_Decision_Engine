[project]
name = "senior-marketing-scientist"
version = "1.0.0"
description = "Marketing Econometrics & Decision Engine (MEDE)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "pymc>=5.15.0",
    "arviz>=0.18.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.5",
    "langfuse>=2.36.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.5",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
